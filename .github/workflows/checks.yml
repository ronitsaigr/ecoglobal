name: EcoGlobal source checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/check-site.mjs
      - run: node tests/worker-smoke.mjs
