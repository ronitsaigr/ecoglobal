name = "ecoglobal-api"
main = "cloudflare/src/worker.js"
compatibility_date = "2026-10-27"
workers_dev = true

# Keep this Worker, D1 database, and private R2 bucket under an account owned by EcoGlobal.
# Run "npx wrangler d1 create ecoglobal-marketplace" and paste the returned database_id.
# R2 must first be enabled for the target Cloudflare account.
[[d1_databases]]
binding = "DB"
database_name = "ecoglobal-marketplace"
database_id = "REPLACE_WITH_ECOGLOBAL_D1_DATABASE_ID"
migrations_dir = "cloudflare/migrations"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "ecoglobal-private-evidence"

[observability]
enabled = true
